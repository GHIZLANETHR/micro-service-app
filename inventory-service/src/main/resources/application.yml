server:
  port: 8082

spring:
  application:
    name: inventory-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:inventory-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true

eureka:
  client:
    enabled: false