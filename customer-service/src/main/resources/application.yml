
server:
  port: 8081

spring:
  application:
    name: customer-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:customer-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true

eureka:
  client:
    enabled: false
