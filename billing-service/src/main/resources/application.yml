
server:
  port: 8083

spring:
  application:
    name: billing-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:billing-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
